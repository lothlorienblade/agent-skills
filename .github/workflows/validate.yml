name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate against the Agent Skills specification
        run: |
          pip install skills-ref==0.1.1
          agentskills validate skills/modular-architecture-refactor
