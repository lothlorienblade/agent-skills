name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate each skill against the Agent Skills specification
        run: |
          pip install skills-ref==0.1.1
          for skill in skills/*/ .agents/skills/*/; do
            echo "::group::$skill"
            agentskills validate "$skill"
            echo "::endgroup::"
          done
      - name: Check repository consistency
        run: python scripts/check_repo.py
